    pool.forEach(p=>{const o=owner(p.lead);if(!map[o]){map[o]=[];order.push(o);}map[o].push(p);});
    order.sort((a,b)=>(a==='Unassigned')-(b==='Unassigned')||map[b].length-map[a].length);
    cols=order.map(o=>({title:o,items:map[o]}));
  }else if(mode==='stage'){
    const stages=['In delivery','Scheduled','To scope'];
    cols=stages.map(s=>({title:s,items:pool.filter(p=>stageOf(p)===s)}));
  }else{
    cols=DATA.streams.map((s,si)=>({title:s.tag,full:s.name,color:s.color,items:pool.filter(p=>p._s===si)})).filter(c=>c.items.length);
  }
  const html=`<div class="board">`+cols.map(col=>`<div class="bcol"><h3>${esc(col.full||col.title)}<span class="ct">${col.items.length}</span></h3><div class="stack">`+
    col.items.map(p=>card(p)).join('')+`</div></div>`).join('')+`</div>`;
  document.getElementById('view-board').innerHTML=html;
  document.querySelectorAll('#view-board .bcard').forEach(c=>c.addEventListener('click',()=>openModal(c.dataset.id)));
}
function card(p){
  const lead=leadTxt(p.lead);
  let tl=p.span?('M'+(p.span[0]+1)+'–M'+(p.span[1]+1)):'unscheduled';
  const nms=(p.allms||[]).length;
  return `<div class="bcard" data-id="${p._id}" style="border-left-color:${p._color}">
    <div class="tags"><span class="tftag" style="background:${p._color}">${esc(p._tag)}</span>${p.memo?'<span class="memo">MEMO</span>':''}</div>
    <div class="bt">${esc(p.label)}</div>
    <div class="meta"><span>${lead?esc(lead):'<span style=color:#bbb>Unassigned</span>'}</span><span class="mlss">${p.budget?money(p.budget):''}${nms?` &middot; <span class="di">&#9670;</span>${nms}`:''}</span></div>
  </div>`;
}

// MODAL
function projById(id){return PROJ.find(p=>p._id===id);}
function openModal(id){
  const p=projById(id);if(!p)return;
  const m=p.memo;const lead=leadTxt(p.lead);
  let body=`<div class="mhd"><div class="barclr" style="background:${p._color}"></div>
    <button class="mclose" id="mclose">&times;</button>
    <span class="tag" style="background:${p._color}">${esc(p._stream)}</span>
    <h2>${esc(p.label)}</h2>
    <div class="facts">${lead?`<span>Lead <b>${esc(lead)}</b></span>`:''}<span>Budget <b>${p.budget?money(p.budget):'—'}</b></span><span>Timeline <b>${p.span?('M'+(p.span[0]+1)+'–M'+(p.span[1]+1)):'—'}</b></span>${(p.allms||[]).length?`<span>Gates <b>${p.allms.length}</b></span>`:''}</div></div>
    <div class="mbd">`;
  if(m){
    if(m.exec)body+=`<div class="exec">${esc(m.exec)}</div>`;
    const f=m.fields||{};const ks=Object.keys(f);
    if(ks.length){body+=`<div class="sec"><h4>Concept</h4>`+ks.map(k=>`<div class="frow"><div class="fk">${esc(k)}</div><div class="fv">${esc(f[k])}</div></div>`).join('')+`</div>`;}
    if(m.merits||m.risks)body+=`<div class="sec"><h4>Merits &amp; risks</h4><div class="rr"><div class="box m"><h5>Strategic merits</h5>${esc(m.merits)||'—'}</div><div class="box r"><h5>Key risks</h5>${esc(m.risks)||'—'}</div></div></div>`;
    if(m.next)body+=`<div class="sec"><h4>Required next steps</h4><div class="next">${esc(m.next)}</div></div>`;
  }else{
    body+=`<div class="sec"><p class="nomemo">No project memo linked yet &mdash; workstreams below.</p></div>`;
  }
  if(p.tasks&&p.tasks.length){
    body+=`<div class="sec"><h4>Workstreams</h4><table class="tt"><thead><tr><th>Workstream</th><th>Timing</th><th>Advisor</th><th>Budget</th></tr></thead><tbody>`+
    p.tasks.map(t=>{let tg=t.bars&&t.bars.length?('M'+(t.bars[0]+1)+'–M'+(t.bars[t.bars.length-1]+1)):(t.when||'');
      return `<tr><td class="tw">${esc(t.label)}${t.specialism?`<div style="font-weight:400;color:#888;font-size:10px;margin-top:1px">${esc(t.specialism)}</div>`:''}</td><td>${esc(tg)||'—'}</td><td>${t.advisor?`<span class="atag">${esc(t.advisor)}</span>`:'—'}</td><td>${t.budget?money(t.budget):''}</td></tr>`;}).join('')+
    `</tbody></table></div>`;
  }
  body+=`</div>`;
  document.getElementById('modalbody').innerHTML=body;
  document.getElementById('modal').classList.add('show');
  document.getElementById('scrim').classList.add('show');
  document.getElementById('mclose').addEventListener('click',closeModal);
}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('scrim').classList.remove('show');}
document.getElementById('scrim').addEventListener('click',closeModal);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// view switch
document.getElementById('viewseg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  const board=b.dataset.v==='board';
  document.getElementById('view-board').style.display=board?'block':'none';
  document.getElementById('view-timeline').style.display=board?'none':'block';
  document.getElementById('grpwrap').style.display=board?'flex':'none';
  if(board)renderBoard();
});
document.getElementById('groupsel').addEventListener('change',renderBoard);

renderTimeline();
</script>
</body>
