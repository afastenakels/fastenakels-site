<style>
:root{--green:#006A4A;--green-dark:#0B460B;--gold:#B29000;--yellow-cover:#FFE265;--ink:#262626;--muted:#595959;--line:#DCDCDC}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--green-dark);display:flex;align-items:center;justify-content:center;padding:24px;position:relative}

.card{position:relative;z-index:1;background:#fff;border-radius:6px;padding:40px 36px 32px;width:min(440px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);border-top:6px solid var(--yellow-cover)}
.card img{width:64px;height:64px;display:block;margin:0 auto 14px}
h1{font-family:"Gelasio",Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;color:var(--green-dark);font-size:1.75rem;text-align:center;margin:0;line-height:1.15}
.sub{text-align:center;color:var(--muted);font-size:.9rem;margin:8px 0 26px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--green-dark);margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line);border-radius:4px;color:var(--ink)}
input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--green)}
button.go{font:inherit;font-weight:600;background:var(--green);color:#fff;border:0;border-radius:4px;padding:11px 18px;cursor:pointer;white-space:nowrap}
button.go:hover{background:var(--green-dark)}
button.go:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{display:none;color:#8A1C1C;font-size:.86rem;margin-top:10px;font-weight:500}
.err.show{display:block}
.busy{display:none;color:var(--muted);font-size:.86rem;margin-top:10px}
.busy.show{display:block}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;font-size:.76rem;color:var(--muted);gap:10px;flex-wrap:wrap}
.lang{display:flex;border:1px solid var(--green);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.74rem;font-weight:600;border:0;background:#fff;color:var(--green);padding:4px 10px;cursor:pointer;line-height:1}
.lang button[aria-pressed="true"]{background:var(--green);color:#fff}
noscript{display:block;color:#8A1C1C;font-size:.86rem;margin-top:10px}
</style>
