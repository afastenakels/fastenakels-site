const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const err = document.getElementById('err');
async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(P.salt), iterations:600000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(P.iv)}, key, b(P.ct));
  document.open(); document.write(new TextDecoder().decode(pt)); document.close();
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = 'Déverrouillage…';
  const pw = document.getElementById('pw').value;
  try { localStorage.setItem('ceet_pw', pw); await unlock(pw); }
  catch (ex) { localStorage.removeItem('ceet_pw'); err.textContent = 'Wrong password.'; }
});
(async () => {
  let saved = null;
  try { saved = localStorage.getItem('ceet_pw'); } catch(e) {}
  if (!saved) return;
  err.textContent = 'Déverrouillage…';
  try { await unlock(saved); } catch (ex) { try{localStorage.removeItem('ceet_pw');}catch(e){} err.textContent = ''; }
})();
